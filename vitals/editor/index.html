<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitals</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <!-- Texts come from the app's translations: data-i18n sets textContent, data-i18n-title sets title. -->
  <header class="top">
    <div class="brand"><span class="dot"></span>Vitals <small data-i18n="subtitle"></small></div>
    <nav id="tabs" class="tabs"></nav>
    <button id="addPage" class="ghost" data-i18n="addPage" data-i18n-title="addPageTitle"></button>
    <div class="spacer"></div>
    <span id="status" class="status" role="status"></span>
    <select id="language" aria-label="Language"></select>
    <button id="revert" class="ghost" data-i18n="revert" disabled></button>
    <button id="save" class="primary" data-i18n="send" disabled></button>
  </header>

  <main class="workspace">
    <section class="stage">
      <div class="stage-bar">
        <label><span data-i18n="page"></span> <input id="pageName" maxlength="24" spellcheck="false"></label>
        <button id="pageLeft" class="ghost" data-i18n-title="pageLeft">◀</button>
        <button id="pageRight" class="ghost" data-i18n-title="pageRight">▶</button>
        <button id="pageDelete" class="ghost danger" data-i18n="deletePage"></button>
        <div class="spacer"></div>
        <div class="seg" id="orientation" role="radiogroup">
          <button data-o="landscape" class="on" data-i18n="landscape"></button><button data-o="portrait" data-i18n="portrait"></button>
        </div>
      </div>
      <div class="phone-wrap">
        <div id="phone" class="phone landscape">
          <div class="rail"></div>
          <div id="screen" class="screen"></div>
        </div>
      </div>
      <p id="fit" class="fit"></p>
      <button id="addRow" class="ghost wide" data-i18n="addRow"></button>
    </section>

    <aside class="inspector" id="inspector"></aside>
  </main>

  <template id="hint">
    <h2 data-i18n="hintTitle"></h2>
    <ol class="hint">
      <li data-i18n="hint1"></li>
      <li data-i18n="hint2"></li>
      <li data-i18n="hint3"></li>
      <li data-i18n="hint4"></li>
      <li data-i18n="hint5"></li>
    </ol>
  </template>
  <script src="editor.js"></script>
</body>
</html>
